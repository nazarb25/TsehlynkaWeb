services:

  web:
    container_name: tsehlynka-web
    # Сервер бере готовий образ з GHCR (`just deploy`); `just up` збирає його локально з `build`.
    image: ghcr.io/nazarb25/tsehlynka-web:${WEB_IMAGE_TAG:-main}
    build:
      context: .
    restart: always
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://tsehlynka-api:8000/api/v1}
      SITE_URL: ${SITE_URL:?SITE_URL is required}
      SITE_INDEXABLE: ${SITE_INDEXABLE:-false}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      SUPPORT_URL: ${SUPPORT_URL:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      CONTACT_TELEGRAM_URL: ${CONTACT_TELEGRAM_URL:-}
      TELEGRAM_CLIENT_ID: ${TELEGRAM_CLIENT_ID:-}
      TELEGRAM_CLIENT_SECRET: ${TELEGRAM_CLIENT_SECRET:-}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3000"
    networks:
      - tsehlynka
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

# Мережу створює Compose API (`just up` у TsehlynkaApi); API в ній — `tsehlynka-api:8000`.
networks:
  tsehlynka:
    name: tsehlynka
    external: true
